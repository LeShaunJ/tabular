name: Test

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
    paths-ignore:
      - '.*'
      - '**.md'
      - 'docs/**'
      - mkdocs.yml
      - LICENSE
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  event_file:
    name: Event File
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}

  build-and-test:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        crystal:
          - 1.15.0
          - 1.16.0
          - 1.17.0
          - latest
          - nightly
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download source
        uses: actions/checkout@v2

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml') }}
          restore-keys: ${{ runner.os }}-shards-

      - name: Install shards
        run: shards update

      - name: Run tests
        run: >-
          shards build &&
          crystal spec -v --fail-fast --tag library --junit_output crtest.xml

      - name: Upload Test Results
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: Test Results (Crystal ${{ matrix.crystal }}; ${{ runner.os }})
          path: crtest.xml
